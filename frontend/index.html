<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AutoMLOps Genie</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#060b14;color:#e2e8f0;min-height:100vh}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:#0d1421}
    ::-webkit-scrollbar-thumb{background:#2d3748;border-radius:3px}

    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes barGrow{from{width:0}to{width:var(--w)}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,179,237,.2)}50%{box-shadow:0 0 40px rgba(99,179,237,.5)}}

    .fade-up{animation:fadeUp .45s ease-out both}
    .shimmer{background:linear-gradient(90deg,#1a2744 25%,#243056 50%,#1a2744 75%);background-size:400px 100%;animation:shimmer 1.4s infinite}
    .glow{animation:glow 2s ease-in-out infinite}

    .hero-bg{background:linear-gradient(135deg,#060b14 0%,#0d1b2a 40%,#0a1628 70%,#060b14 100%)}
    .card{background:rgba(13,27,42,.85);border:1px solid rgba(99,179,237,.14);border-radius:16px;backdrop-filter:blur(12px)}
    .badge{display:inline-flex;align-items:center;gap:5px;background:rgba(99,179,237,.1);border:1px solid rgba(99,179,237,.22);color:#90cdf4;border-radius:20px;padding:4px 12px;font-size:.72rem;font-weight:600}

    .drop-zone{border:2px dashed rgba(99,179,237,.3);border-radius:14px;transition:all .25s;cursor:pointer}
    .drop-zone:hover,.drop-zone.active{border-color:#63b3ed;background:rgba(99,179,237,.06)}

    .btn-primary{background:linear-gradient(135deg,#2b6cb0,#1a4e8a);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(43,108,176,.4)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .tab{padding:10px 18px;border:none;background:transparent;color:#718096;font-weight:600;font-size:.83rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
    .tab.active{color:#63b3ed;border-bottom-color:#63b3ed}

    .stage-dot{width:10px;height:10px;border-radius:50%;background:#2d3748;transition:background .4s}
    .stage-dot.done{background:#48bb78}
    .stage-dot.active{background:#63b3ed;animation:pulse 1s infinite}

    .score-bar-bg{background:rgba(99,179,237,.1);border-radius:4px;overflow:hidden;height:7px}
    .score-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#2b6cb0,#63b3ed);transition:width 1s ease-out}

    input,textarea{background:rgba(13,27,42,.8);border:1px solid rgba(99,179,237,.2);border-radius:10px;color:#e2e8f0;outline:none;transition:border .2s;font-family:inherit}
    input:focus,textarea:focus{border-color:#63b3ed}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ── API helpers ─────────────────────────────────────── */
const api = {
  health: () => fetch('/api/health').then(r=>r.json()),
  analyze: (fd) => fetch('/api/analyze',{method:'POST',body:fd}).then(r=>r.json()),
  status:  (id) => fetch(`/api/status/${id}`).then(r=>r.json()),
  runs:    ()   => fetch('/api/runs').then(r=>r.json()),
};

/* ── Shimmer skeleton ────────────────────────────────── */
function Skeleton({h='18px',w='100%',r='6px'}){
  return <div className="shimmer" style={{height:h,width:w,borderRadius:r}}/>;
}

/* ── Spinning loader ─────────────────────────────────── */
function Spinner({size=20,color='#63b3ed'}){
  return <div style={{width:size,height:size,border:`2px solid rgba(99,179,237,.2)`,borderTopColor:color,borderRadius:'50%',animation:'spin .7s linear infinite'}}/>;
}

/* ── Navbar ──────────────────────────────────────────── */
function Navbar({apiReady}){
  return (
    <nav style={{position:'sticky',top:0,zIndex:100,background:'rgba(6,11,20,.92)',backdropFilter:'blur(16px)',borderBottom:'1px solid rgba(99,179,237,.1)',padding:'0 32px',height:62,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <div style={{background:'linear-gradient(135deg,#2b6cb0,#63b3ed)',borderRadius:10,padding:'7px 9px',fontSize:'1.2rem'}}>🧞</div>
        <div>
          <div style={{fontWeight:900,fontSize:'.95rem',color:'#e2e8f0',lineHeight:1}}>AutoMLOps Genie</div>
          <div style={{fontSize:'.62rem',color:'#4a5568',fontWeight:500}}>LLM-Powered AutoML Pipeline</div>
        </div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span className="badge">⚡ AutoGluon</span>
        <span className="badge">🤖 Gemini Function Calling</span>
        <div style={{display:'flex',alignItems:'center',gap:7,marginLeft:8}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:apiReady===null?'#f6ad55':apiReady?'#48bb78':'#fc8181',boxShadow:`0 0 0 3px ${apiReady===null?'#f6ad5533':apiReady?'#48bb7833':'#fc818133'}`}}/>
          <span style={{fontSize:'.75rem',fontWeight:600,color:'#718096'}}>{apiReady===null?'Connecting…':apiReady?'Ready':'API Key Missing'}</span>
        </div>
      </div>
    </nav>
  );
}

/* ── Hero ────────────────────────────────────────────── */
function Hero(){
  return (
    <div className="hero-bg" style={{padding:'52px 32px 40px',textAlign:'center',position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-80,right:-80,width:300,height:300,background:'radial-gradient(circle,rgba(99,179,237,.08) 0%,transparent 70%)',borderRadius:'50%'}}/>
      <div style={{position:'absolute',bottom:-60,left:-40,width:220,height:220,background:'radial-gradient(circle,rgba(72,187,120,.06) 0%,transparent 70%)',borderRadius:'50%'}}/>
      <div style={{position:'relative',zIndex:1}} className="fade-up">
        <div style={{display:'inline-block',background:'rgba(99,179,237,.1)',border:'1px solid rgba(99,179,237,.2)',borderRadius:20,padding:'5px 18px',marginBottom:18,fontSize:'.73rem',color:'#90cdf4',fontWeight:700,letterSpacing:'.5px'}}>
          ✨ AutoML · Zero Code Required
        </div>
        <h1 style={{color:'#fff',fontWeight:900,fontSize:'clamp(1.6rem,4vw,2.6rem)',margin:'0 0 14px',letterSpacing:'-.5px',lineHeight:1.15}}>
          Describe your ML task.<br/>
          <span style={{background:'linear-gradient(135deg,#63b3ed,#90cdf4)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>
            Genie does the rest.
          </span>
        </h1>
        <p style={{color:'rgba(255,255,255,.55)',fontSize:'1rem',maxWidth:500,margin:'0 auto 28px',lineHeight:1.7}}>
          Upload a CSV, type one sentence. AutoGluon trains and ranks multiple models automatically. MLflow tracks everything.
        </p>
        <div style={{display:'flex',justifyContent:'center',gap:40,flexWrap:'wrap'}}>
          {[['7+','Models Trained'],['Auto','Feature Importance'],['MLflow','Observability'],['SHAP','Explainability']].map(([n,l])=>(
            <div key={l} style={{textAlign:'center'}}>
              <div style={{fontWeight:900,fontSize:'1.3rem',color:'#fff',lineHeight:1}}>{n}</div>
              <div style={{fontSize:'.67rem',color:'rgba(255,255,255,.45)',marginTop:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>{l}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── File Drop Zone ──────────────────────────────────── */
function DropZone({onFile,file}){
  const [drag,setDrag]=useState(false);
  const ref=useRef();
  const handle=f=>{if(f&&f.name.endsWith('.csv'))onFile(f);};
  return (
    <div className={`drop-zone${drag?' active':''}`}
      style={{padding:'28px 20px',textAlign:'center'}}
      onClick={()=>ref.current.click()}
      onDragOver={e=>{e.preventDefault();setDrag(true)}}
      onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);handle(e.dataTransfer.files[0])}}
    >
      <input ref={ref} type="file" accept=".csv" style={{display:'none'}} onChange={e=>handle(e.target.files[0])}/>
      {file ? (
        <div style={{display:'flex',alignItems:'center',gap:10,justifyContent:'center'}}>
          <div style={{background:'rgba(72,187,120,.15)',border:'1px solid rgba(72,187,120,.3)',borderRadius:8,padding:'6px 10px',fontSize:'1.1rem'}}>📊</div>
          <div style={{textAlign:'left'}}>
            <div style={{fontWeight:700,color:'#e2e8f0',fontSize:'.88rem'}}>{file.name}</div>
            <div style={{fontSize:'.72rem',color:'#48bb78',marginTop:2}}>✓ CSV ready</div>
          </div>
        </div>
      ) : (
        <>
          <div style={{fontSize:'2rem',marginBottom:10}}>📂</div>
          <div style={{fontWeight:700,color:'#90cdf4',fontSize:'.88rem'}}>Drop CSV here or click to browse</div>
          <div style={{fontSize:'.73rem',color:'#4a5568',marginTop:6}}>Supports any tabular dataset</div>
        </>
      )}
    </div>
  );
}

/* ── Column chips ────────────────────────────────────── */
function ColumnChips({columns,target}){
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:12}}>
      {columns.map(c=>(
        <span key={c} style={{
          padding:'3px 10px',borderRadius:20,fontSize:'.72rem',fontWeight:600,
          background: c===target ? 'rgba(72,187,120,.18)' : 'rgba(99,179,237,.08)',
          border: `1px solid ${c===target ? 'rgba(72,187,120,.4)' : 'rgba(99,179,237,.18)'}`,
          color: c===target ? '#68d391' : '#90cdf4',
        }}>{c===target?'🎯 ':''}{c}</span>
      ))}
    </div>
  );
}

/* ── Sample dataset buttons ──────────────────────────── */
const SAMPLES=[
  {label:'📉 Churn',    file:'churn_sample.csv',    prompt:'Predict Churn using all features'},
  {label:'🔍 Fraud',    file:'fraud_sample.csv',     prompt:'Predict is_fraud using all features'},
  {label:'🏥 Insurance',file:'insurance_sample.csv', prompt:'Predict charges using all features'},
];

/* ── Pipeline progress stages ────────────────────────── */
const STAGES=[
  'Gemini parses prompt',
  'Dataset prepared',
  'Models training',
  'Models evaluated',
  'Feature importance',
  'Complete',
];
function getStageIdx(progress){
  if(progress<15)return 0;
  if(progress<30)return 1;
  if(progress<70)return 2;
  if(progress<85)return 3;
  if(progress<100)return 4;
  return 5;
}

function PipelineProgress({job}){
  const pct=job.progress||0;
  const stageIdx=getStageIdx(pct);
  return (
    <div className="card fade-up" style={{padding:28,marginTop:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <span style={{fontWeight:700,color:'#90cdf4',fontSize:'.9rem'}}>Pipeline Running</span>
        <span style={{fontWeight:800,color:'#63b3ed',fontSize:'1rem'}}>{pct}%</span>
      </div>
      {/* Progress bar */}
      <div style={{background:'rgba(99,179,237,.1)',borderRadius:6,height:8,overflow:'hidden',marginBottom:20}}>
        <div style={{height:'100%',borderRadius:6,background:'linear-gradient(90deg,#2b6cb0,#63b3ed,#90cdf4)',width:`${pct}%`,transition:'width .8s ease-out'}}/>
      </div>
      {/* Stages */}
      <div style={{display:'flex',justifyContent:'space-between',position:'relative'}}>
        <div style={{position:'absolute',top:4,left:0,right:0,height:2,background:'rgba(99,179,237,.1)'}}/>
        <div style={{position:'absolute',top:4,left:0,height:2,background:'linear-gradient(90deg,#2b6cb0,#63b3ed)',width:`${Math.min(100,(stageIdx/(STAGES.length-1))*100)}%`,transition:'width .8s ease-out'}}/>
        {STAGES.map((s,i)=>(
          <div key={s} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,zIndex:1}}>
            <div className={`stage-dot${i<stageIdx?' done':i===stageIdx?' active':''}`}/>
            <span style={{fontSize:'.6rem',color:i<=stageIdx?'#90cdf4':'#4a5568',fontWeight:600,textAlign:'center',maxWidth:64}}>{s}</span>
          </div>
        ))}
      </div>
      <div style={{marginTop:16,fontSize:'.8rem',color:'#718096',display:'flex',alignItems:'center',gap:8}}>
        <Spinner size={14}/> {job.stage||'Working…'}
      </div>
    </div>
  );
}

/* ── Leaderboard ─────────────────────────────────────── */
function Leaderboard({data}){
  const [show,setShow]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setShow(true),100);return()=>clearTimeout(t);},[]);
  if(!data||!data.length)return <p style={{color:'#718096'}}>No leaderboard data.</p>;
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
        <div style={{background:'rgba(72,187,120,.15)',border:'1px solid rgba(72,187,120,.3)',borderRadius:8,padding:'6px 10px',fontSize:'1rem'}}>🏆</div>
        <div>
          <div style={{fontWeight:700,color:'#e2e8f0',fontSize:'.9rem'}}>Best Model: <span style={{color:'#68d391'}}>{data[0].model}</span></div>
          <div style={{fontSize:'.73rem',color:'#718096',marginTop:2}}>Score: <span style={{color:'#63b3ed',fontWeight:700}}>{Math.abs(data[0].score_val).toFixed(4)}</span></div>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {data.map((r,i)=>(
          <div key={r.model} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:i===0?'rgba(72,187,120,.06)':'rgba(13,27,42,.5)',border:`1px solid ${i===0?'rgba(72,187,120,.2)':'rgba(99,179,237,.08)'}`,borderRadius:10}}>
            <span style={{fontWeight:800,color:i===0?'#68d391':'#4a5568',fontSize:'.8rem',width:20,textAlign:'center'}}>{i+1}</span>
            <span style={{fontWeight:600,color:'#e2e8f0',fontSize:'.82rem',flex:1}}>{r.model}</span>
            <div style={{width:120}}>
              <div className="score-bar-bg">
                <div className="score-bar" style={{width:show?`${r.score_pct||0}%`:'0%'}}/>
              </div>
            </div>
            <span style={{fontWeight:700,color:'#90cdf4',fontSize:'.78rem',width:56,textAlign:'right'}}>{Math.abs(r.score_val).toFixed(3)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Feature Importance Chart (Chart.js) ─────────────── */
function FeatureChart({data,target}){
  const canvasRef=useRef();
  const chartRef=useRef();
  useEffect(()=>{
    if(!data||!data.length||!canvasRef.current)return;
    if(chartRef.current)chartRef.current.destroy();
    const top=data.slice(0,12);
    const maxVal=top[0].importance||1;
    chartRef.current=new Chart(canvasRef.current,{
      type:'bar',
      data:{
        labels:top.map(d=>d.feature),
        datasets:[{
          label:'Correlation with target',
          data:top.map(d=>d.importance),
          backgroundColor:top.map((_,i)=>i<4?'rgba(99,179,237,.85)':'rgba(99,179,237,.35)'),
          borderColor:top.map((_,i)=>i<4?'#63b3ed':'rgba(99,179,237,.5)'),
          borderWidth:1,
          borderRadius:5,
        }]
      },
      options:{
        indexAxis:'y',
        responsive:true,
        animation:{duration:900,easing:'easeOutQuart'},
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor:'rgba(6,11,20,.9)',
            borderColor:'rgba(99,179,237,.3)',
            borderWidth:1,
            callbacks:{
              label:ctx=>`  Importance: ${ctx.raw.toFixed(4)}`
            }
          }
        },
        scales:{
          x:{
            grid:{color:'rgba(99,179,237,.07)'},
            ticks:{color:'#718096',font:{size:11}},
            max:Math.ceil(maxVal*10)/10,
          },
          y:{
            grid:{display:false},
            ticks:{color:'#e2e8f0',font:{size:12,weight:'600'}},
          }
        }
      }
    });
    return()=>{if(chartRef.current)chartRef.current.destroy()};
  },[data]);

  if(!data||!data.length)return <p style={{color:'#718096'}}>No feature data available.</p>;
  return (
    <div>
      <div style={{marginBottom:14,fontSize:'.82rem',color:'#718096'}}>
        Top features by absolute correlation with <span style={{color:'#68d391',fontWeight:700}}>"{target}"</span> — brighter = stronger predictor
      </div>
      <canvas ref={canvasRef} style={{maxHeight:380}}/>
    </div>
  );
}

/* ── Download tab ────────────────────────────────────── */
function DownloadTab({jobId,modelInfo}){
  return (
    <div>
      <a href={`/api/download/${jobId}`} download="model_info.txt"
        style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'14px',background:'linear-gradient(135deg,#2b6cb0,#1a4e8a)',borderRadius:10,color:'#fff',fontWeight:700,fontSize:'.9rem',textDecoration:'none',marginBottom:20,transition:'all .2s'}}
        onMouseOver={e=>e.currentTarget.style.transform='translateY(-1px)'}
        onMouseOut={e=>e.currentTarget.style.transform='translateY(0)'}
      >
        ⬇️ Download model_info.txt
      </a>
      {modelInfo&&(
        <pre style={{background:'rgba(13,27,42,.8)',border:'1px solid rgba(99,179,237,.12)',borderRadius:10,padding:20,fontSize:'.78rem',color:'#90cdf4',overflow:'auto',lineHeight:1.7}}>{modelInfo}</pre>
      )}
    </div>
  );
}

/* ── Results panel ───────────────────────────────────── */
function Results({job,jobId}){
  const [tab,setTab]=useState('leaderboard');
  const tabs=[['leaderboard','🏆 Leaderboard'],['importance','🔍 Feature Importance'],['download','⬇️ Download']];
  return (
    <div className="card fade-up" style={{padding:28,marginTop:24}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22}}>
        <div style={{background:'rgba(72,187,120,.15)',borderRadius:10,padding:'8px 10px',fontSize:'1.1rem'}}>✅</div>
        <div>
          <div style={{fontWeight:800,color:'#68d391',fontSize:'.9rem'}}>Pipeline Complete</div>
          <div style={{fontSize:'.78rem',color:'#718096',marginTop:2}}>{job.result}</div>
        </div>
      </div>
      <div style={{display:'flex',borderBottom:'1px solid rgba(99,179,237,.1)',marginBottom:22}}>
        {tabs.map(([id,label])=>(
          <button key={id} className={`tab${tab===id?' active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>
      {tab==='leaderboard'&&<Leaderboard data={job.leaderboard}/>}
      {tab==='importance'&&<FeatureChart data={job.feature_importance} target={job.parsed?.target}/>}
      {tab==='download'&&<DownloadTab jobId={jobId} modelInfo={job.model_info}/>}
    </div>
  );
}

/* ── Experiment History ──────────────────────────────── */
function ExperimentHistory(){
  const [runs,setRuns]=useState(null);
  useEffect(()=>{api.runs().then(d=>setRuns(d.runs)).catch(()=>setRuns([]));},[]);
  if(runs===null)return <div style={{display:'flex',flexDirection:'column',gap:8}}>{[1,2,3].map(i=><Skeleton key={i} h="36px"/>)}</div>;
  if(!runs.length)return <p style={{color:'#4a5568',fontSize:'.8rem'}}>No experiments yet.</p>;
  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {runs.map((r,i)=>(
        <div key={i} style={{padding:'10px 12px',background:'rgba(13,27,42,.6)',border:'1px solid rgba(99,179,237,.1)',borderRadius:8,fontSize:'.75rem'}}>
          <div style={{fontWeight:700,color:'#90cdf4',marginBottom:3}}>{r['params.target']||'—'}</div>
          <div style={{color:'#718096',display:'flex',justifyContent:'space-between'}}>
            <span>{r['params.task_type']||'—'}</span>
            <span style={{color:'#63b3ed',fontWeight:600}}>{r['metrics.accuracy']?`${(r['metrics.accuracy']*100).toFixed(1)}%`:r['metrics.rmse']?`RMSE ${Number(r['metrics.rmse']).toFixed(2)}`:'—'}</span>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   Main App
════════════════════════════════════════════════════════ */
function App(){
  const [apiReady,setApiReady]=useState(null);
  const [file,setFile]=useState(null);
  const [columns,setColumns]=useState([]);
  const [prompt,setPrompt]=useState('');
  const [loading,setLoading]=useState(false);
  const [jobId,setJobId]=useState(null);
  const [job,setJob]=useState(null);
  const [error,setError]=useState('');
  const pollRef=useRef(null);

  useEffect(()=>{
    api.health().then(d=>setApiReady(d.gemini_configured)).catch(()=>setApiReady(false));
  },[]);

  // Parse CSV on upload
  useEffect(()=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const lines=e.target.result.split('\n');
      if(lines[0]){
        const cols=lines[0].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
        setColumns(cols);
        setPrompt(`Predict ${cols[cols.length-1]} using all features`);
      }
    };
    reader.readAsText(file);
  },[file]);

  // Load sample dataset
  const loadSample=async(sample)=>{
    const resp=await fetch(`/data/${sample.file}`).catch(()=>null);
    if(!resp||!resp.ok){setError(`Sample file not found: ${sample.file}`);return;}
    const blob=await resp.blob();
    const f=new File([blob],sample.file,{type:'text/csv'});
    setFile(f);setPrompt(sample.prompt);setError('');
  };

  // Poll job status
  const startPolling=(id)=>{
    if(pollRef.current)clearInterval(pollRef.current);
    pollRef.current=setInterval(async()=>{
      try{
        const j=await api.status(id);
        setJob(j);
        if(j.status==='complete'||j.status==='error'){
          clearInterval(pollRef.current);
          setLoading(false);
        }
      }catch{}
    },1500);
  };

  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current)},[]);

  const handleRun=async()=>{
    if(!file)return setError('Please upload a CSV file first.');
    if(!prompt.trim())return setError('Please describe your ML task.');
    setError('');setLoading(true);setJob(null);setJobId(null);
    const fd=new FormData();
    fd.append('file',file);
    fd.append('prompt',prompt);
    try{
      const {job_id,error:err}=await api.analyze(fd);
      if(err||!job_id){setError(err||'Analysis failed.');setLoading(false);return;}
      setJobId(job_id);
      setJob({status:'running',progress:5,stage:'Starting pipeline…'});
      startPolling(job_id);
    }catch(e){
      setError(e.message||'Request failed.');
      setLoading(false);
    }
  };

  const target=columns.find(c=>prompt.toLowerCase().includes(c.toLowerCase()))||'';

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Navbar apiReady={apiReady}/>
      <Hero/>

      <div style={{maxWidth:1100,width:'100%',margin:'0 auto',padding:'32px 24px 60px',flex:1}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:28,alignItems:'start'}}>

          {/* ── Left column ── */}
          <div>
            {/* Upload */}
            <div className="card fade-up" style={{padding:24,marginBottom:20}}>
              <h2 style={{fontWeight:800,fontSize:'1rem',color:'#e2e8f0',marginBottom:16}}>📁 Upload Dataset</h2>
              <DropZone onFile={f=>{setFile(f);setError('');}} file={file}/>

              {/* Sample buttons */}
              <div style={{marginTop:14}}>
                <div style={{fontSize:'.73rem',color:'#4a5568',fontWeight:600,marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}}>Or try a sample:</div>
                <div style={{display:'flex',gap:8}}>
                  {SAMPLES.map(s=>(
                    <button key={s.file} onClick={()=>loadSample(s)}
                      style={{flex:1,padding:'8px',background:'rgba(99,179,237,.07)',border:'1px solid rgba(99,179,237,.18)',borderRadius:8,color:'#90cdf4',fontWeight:600,fontSize:'.75rem',cursor:'pointer',transition:'all .2s'}}
                      onMouseOver={e=>e.currentTarget.style.background='rgba(99,179,237,.14)'}
                      onMouseOut={e=>e.currentTarget.style.background='rgba(99,179,237,.07)'}
                    >{s.label}</button>
                  ))}
                </div>
              </div>

              {/* Column chips */}
              {columns.length>0&&(
                <div style={{marginTop:16}}>
                  <div style={{fontSize:'.73rem',color:'#4a5568',fontWeight:600,marginBottom:6,textTransform:'uppercase',letterSpacing:'.5px'}}>Columns detected:</div>
                  <ColumnChips columns={columns} target={target}/>
                </div>
              )}
            </div>

            {/* Prompt + Run */}
            <div className="card fade-up" style={{padding:24,animationDelay:'.1s'}}>
              <h2 style={{fontWeight:800,fontSize:'1rem',color:'#e2e8f0',marginBottom:14}}>🎯 Describe Your ML Task</h2>
              <textarea
                value={prompt}
                onChange={e=>setPrompt(e.target.value)}
                placeholder="e.g. Predict customer churn using all features"
                rows={3}
                style={{width:'100%',padding:'12px 14px',fontSize:'.88rem',resize:'vertical',marginBottom:14}}
              />
              {error&&<div style={{background:'rgba(252,129,129,.1)',border:'1px solid rgba(252,129,129,.3)',borderRadius:8,padding:'10px 14px',color:'#fc8181',fontSize:'.8rem',marginBottom:14}}>{error}</div>}
              <button
                className="btn-primary"
                onClick={handleRun}
                disabled={loading||!file}
                style={{width:'100%',padding:'14px',fontSize:'.9rem'}}
              >
                {loading ? <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10}}><Spinner size={16}/>Running pipeline…</span> : '🚀 Run AutoML Pipeline'}
              </button>
            </div>

            {/* Progress */}
            {job&&job.status==='running'&&<PipelineProgress job={job}/>}

            {/* Error from job */}
            {job&&job.status==='error'&&(
              <div className="card fade-up" style={{padding:20,marginTop:20,borderColor:'rgba(252,129,129,.3)'}}>
                <div style={{color:'#fc8181',fontWeight:700,marginBottom:6}}>❌ Pipeline Failed</div>
                <div style={{color:'#718096',fontSize:'.82rem'}}>{job.error}</div>
              </div>
            )}

            {/* Results */}
            {job&&job.status==='complete'&&<Results job={job} jobId={jobId}/>}
          </div>

          {/* ── Right sidebar ── */}
          <div style={{display:'flex',flexDirection:'column',gap:20}}>

            {/* How it works */}
            <div className="card fade-up" style={{padding:22,animationDelay:'.15s'}}>
              <h3 style={{fontWeight:800,fontSize:'.85rem',color:'#90cdf4',marginBottom:16,textTransform:'uppercase',letterSpacing:'.5px'}}>How It Works</h3>
              {[
                ['🤖','Gemini Function Calling','Parses your English prompt into a structured ML config using the Gemini tools API'],
                ['⚡','AutoGluon AutoML','Trains 7+ model types simultaneously — GBM, Random Forest, Extra Trees, KNN, Ensembles'],
                ['📈','MLflow Tracking','Every run logs target, task type, model name, accuracy, and artifacts automatically'],
                ['🔍','SHAP / Correlation','Feature importance reveals which columns drive predictions most strongly'],
              ].map(([icon,title,desc])=>(
                <div key={title} style={{display:'flex',gap:12,marginBottom:16}}>
                  <div style={{width:32,height:32,background:'rgba(99,179,237,.1)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.9rem',flexShrink:0}}>{icon}</div>
                  <div>
                    <div style={{fontWeight:700,color:'#e2e8f0',fontSize:'.8rem',marginBottom:3}}>{title}</div>
                    <div style={{fontSize:'.72rem',color:'#718096',lineHeight:1.55}}>{desc}</div>
                  </div>
                </div>
              ))}
            </div>

            {/* Experiment history */}
            <div className="card fade-up" style={{padding:22,animationDelay:'.2s'}}>
              <h3 style={{fontWeight:800,fontSize:'.85rem',color:'#90cdf4',marginBottom:14,textTransform:'uppercase',letterSpacing:'.5px'}}>📊 Experiment History</h3>
              <ExperimentHistory/>
            </div>

            {/* Powered by */}
            <div className="card fade-up" style={{padding:22,animationDelay:'.25s'}}>
              <h3 style={{fontWeight:800,fontSize:'.85rem',color:'#90cdf4',marginBottom:14,textTransform:'uppercase',letterSpacing:'.5px'}}>Powered By</h3>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {[['🤖','Gemini 2.5 Flash','Function Calling'],['⚡','AutoGluon 1.2','AutoML Framework'],['📈','MLflow','Experiment Tracking'],['🔍','SHAP','Explainability'],['🐍','FastAPI','Backend API'],].map(([icon,name,role])=>(
                  <div key={name} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:'rgba(99,179,237,.04)',borderRadius:8}}>
                    <span style={{fontSize:'.9rem'}}>{icon}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,color:'#e2e8f0',fontSize:'.78rem'}}>{name}</div>
                      <div style={{fontSize:'.68rem',color:'#4a5568'}}>{role}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
