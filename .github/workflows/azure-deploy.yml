name: Build, Test & Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RESOURCE_GROUP: automlops-genie-rg
  ACR_NAME: automlopsgenieacr
  APP_NAME: automlops-genie
  CONTAINER_APP_ENV: automlops-env
  LOCATION: eastus

jobs:
  # ── Job 1: Run automated tests ────────────────────────────────────────────
  test:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov openai pandas numpy mlflow python-dotenv

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=genie_agent --cov=pipelines --cov-report=term-missing
        env:
          OPENAI_API_KEY: "sk-test-placeholder"   # real calls are mocked in tests

  # ── Job 2: Deploy to Azure (main branch only) ─────────────────────────────
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: test                 # only deploy if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push to Azure Container Registry
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image $APP_NAME:${{ github.sha }} \
            --image $APP_NAME:latest \
            .

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $(az acr show --name $ACR_NAME --query loginServer -o tsv)/$APP_NAME:${{ github.sha }}

      - name: Print live URL
        run: |
          URL=$(az containerapp show \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "✅ Deployed to: https://$URL"
