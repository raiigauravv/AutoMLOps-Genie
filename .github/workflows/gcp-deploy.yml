name: Build, Test & Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION: us-central1
  REPOSITORY: automlops-genie
  SERVICE: automlops-genie

jobs:
  # ── Job 1: Run automated tests ────────────────────────────────────────────
  test:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov google-generativeai pandas numpy mlflow python-dotenv

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=genie_agent --cov=pipelines --cov-report=term-missing
        env:
          GEMINI_API_KEY: "test-placeholder"   # real calls are mocked in tests

  # ── Job 2: Deploy to GCP Cloud Run (main branch only) ─────────────────────
  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: test                 # only deploy if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image via Cloud Build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

          # Submit async and poll status instead of streaming logs live —
          # the GitHub Actions service account isn't a project Viewer/Owner,
          # so gcloud's live log tailing is blocked even though the build itself succeeds.
          BUILD_ID=$(gcloud builds submit --tag "$IMAGE" --async --format="value(id)" .)
          echo "Cloud Build ID: $BUILD_ID"

          for i in $(seq 1 60); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            echo "[$i] Build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED)
                echo "::error::Cloud Build failed with status $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done

          if [ "$STATUS" != "SUCCESS" ]; then
            echo "::error::Cloud Build did not reach SUCCESS within the polling window (last status: $STATUS)"
            exit 1
          fi

      - name: Deploy to Cloud Run
        run: |
          # Pipeline job state lives in an in-memory dict in server.py, not a shared
          # store — with the default autoscaling, a POST /api/analyze and its later
          # GET /api/status polls can land on different instances (or the single
          # instance can scale to zero and back), so a job that was written on one
          # instance 404s as "Job not found" on another. Pinning to exactly one
          # instance makes that in-memory state consistent across every request.
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8501 \
            --min-instances=1 \
            --max-instances=1 \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"

      - name: Print live URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "✅ Deployed to: $URL"
